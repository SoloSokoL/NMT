var db=null;
function initFirebase(){
if(FIREBASE_CONFIG.apiKey==="ВСТАВ_СЮДИ") return;
try{
if(window.firebase && !firebase.apps.length){ firebase.initializeApp(FIREBASE_CONFIG); }
db=firebase.firestore();
}catch(e){ db=null; }
}
function getSyncCode(){ try{ return localStorage.getItem('nmt-sync-code')||''; }catch(e){ return ''; } }
function setSyncCodeLS(code){ try{ localStorage.setItem('nmt-sync-code', code); }catch(e){} }
function cloudSave(){
if(!db) return;
var code=getSyncCode();
if(!code) return;
db.collection('nmt-tracker').doc(code).set(STATE).catch(function(){});
}
function cloudLoad(code,cb){
if(!db){ cb(null); return; }
db.collection('nmt-tracker').doc(code).get().then(function(snap){
cb(snap.exists?snap.data():null);
}).catch(function(){ cb(null); });
}
function applySyncCode(){
var inp=document.getElementById('syncCodeInput');
var code=(inp.value||'').trim();
var st=document.getElementById('syncStatusMsg');
if(!code) return;
setSyncCodeLS(code);
if(!db){ if(st) st.textContent='Хмара не налаштована у файлі (див. FIREBASE_CONFIG).'; return; }
if(st) st.textContent='Завантаження…';
cloudLoad(code,function(remote){
if(remote){
STATE=remote;
ORDER.forEach(function(s){ STATE[s]=STATE[s]||{}; });
STATE.mockLog=STATE.mockLog||{};
ORDER.forEach(function(s){ STATE.mockLog[s]=STATE.mockLog[s]||[]; });
render();
persist();
if(st) st.textContent='Синхронізовано ✓';
} else {
cloudSave();
render();
if(st) st.textContent='Новий код створено, дані збережено ✓';
}
});
}
function genSyncCode(){
var inp=document.getElementById('syncCodeInput');
var c=Math.random().toString(36).slice(2,8).toUpperCase();
if(inp) inp.value=c;
applySyncCode();
}

function syncBarHTML(){
if(!db){
return '<div class="sync"><span class="meta" style="padding-left:0">☁️ Хмарна синхронізація вимкнена. Щоб прогрес бачило на всіх пристроях — впиши свій Firebase-конфіг у файл (див. FIREBASE_CONFIG на початку коду). Без цього прогрес зберігається лише в пам\'яті цього браузера.</span></div>';
}
var code=getSyncCode();
return '<div class="sync">'
+'<input id="syncCodeInput" placeholder="код синхронізації" value="'+esc(code)+'">'
+'<button type="button" onclick="applySyncCode()">Підключити</button>'
+'<button type="button" onclick="genSyncCode()">Створити новий код</button>'
+'<span id="syncStatusMsg" class="meta" style="padding-left:0">'+(code?'Код активний: '+esc(code):'Введи код на іншому пристрої, щоб з\'єднати прогрес')+'</span>'
+'</div>';
}

function render(){
var overallDone=0, overallTotal=0, subjHtml='';
ORDER.forEach(function(subj){
var m=META[subj], list=TOPICS[subj], st=STATE[subj]||{};
var done=0;
list.forEach(function(_,i){ if(st[i]&&st[i].done) done++; });
overallDone+=done; overallTotal+=list.length;
var pct=Math.round(done/list.length*100);
subjHtml+='<div class="subject" style="--c:'+m.color+'">';
var SUBJ_ICON={math:'📐',ukr:'🔤',hist:'🏛️',eng:'🇬🇧'};
subjHtml+='<h2>'+SUBJ_ICON[subj]+' '+m.name+'</h2>';
subjHtml+='<p class="meta">'+done+'/'+list.length+' · ≈'+m.time+'</p>';
subjHtml+='<div class="bar"><i style="width:'+pct+'%"></i></div>';
var mocks=STATE.mockLog[subj]||[];
subjHtml+='<div class="mock"><h3>Пробні тести</h3><form onsubmit="return addMock(event,\''+subj+'\')"><input type="number" min="0" max="200" placeholder="бал" required id="mi-'+subj+'"><button type="submit">Додати</button></form>';
if(mocks.length){
subjHtml+='<div class="hist">';
mocks.forEach(function(mk,mi){ subjHtml+='<span class="chip">'+mk.date+': '+mk.score+'<button type="button" class="chip-x" title="Видалити" onclick="removeMock(\''+subj+'\','+mi+')">✕</button></span>'; });
subjHtml+='</div>';
} else {
subjHtml+='<p class="meta" style="padding-left:0">Ще немає записів</p>';
}
subjHtml+='</div>';
if(subj==='eng'){
subjHtml+='<p class="meta" style="padding-left:0"><a href="'+FULL.eT1+'" target="_blank" rel="noopener">🔢 Пробний тест №1 НМТ з англійської (osvita.ua)</a> · <a href="'+FULL.eT2+'" target="_blank" rel="noopener">Тест №2</a></p>';
}
BLOCKS[subj].forEach(function(block){
subjHtml+='<div class="block-h">'+esc(block.t)+'</div>';
block.idx.forEach(function(i){
var title=list[i];
var d=st[i]||{};
var theoryUrl, testUrl;
if(subj==='eng'){
theoryUrl=linkURL(ENG_THEORY[i])||ytSearch(title,"англійська мова граматика чи лексика");
testUrl=null;
} else {
var existingUrl=linkURL(LINKS[subj][i]);
var sec=secondLink(subj,title);
if(subj==='math'){ theoryUrl=existingUrl; testUrl=sec.url; }
else { testUrl=existingUrl; theoryUrl=sec.url; }
}
var isVid=/youtu\.?be/i.test(theoryUrl||'');
subjHtml+='<div class="row">'
+'<div class="row-main">'
+'<input type="checkbox" '+(d.done?'checked':'')+' onchange="toggle(\''+subj+'\','+i+')">'
+'<span class="t'+(d.done?' done':'')+'"><span class="num">'+(i+1)+'.</span>'+esc(title)+'</span>'
+(theoryUrl?'<a class="lnk" href="'+theoryUrl+'" target="_blank" rel="noopener" title="'+(isVid?'Відеоурок':'Теорія')+'">'+(isVid?'▶️':'📖')+'</a>':'<span class="lnk lnk-empty"></span>')
+(testUrl?'<a class="lnk" href="'+testUrl+'" target="_blank" rel="noopener" title="Тестування-пробник НМТ">🔢</a>':'<span class="lnk lnk-empty"></span>')
+'</div>'
+'<div class="row-sub">'
+'<span class="date">'+(d.date||'')+'</span>'
+'<input class="n" placeholder="бал/нотатка" value="'+esc(d.note||'')+'" onchange="noteChange(\''+subj+'\','+i+',this.value)">'
+'<span class="cnt-label">завдань:</span>'
+'<input class="cnt" type="number" min="0" max="999" value="'+esc(d.count||'')+'" onchange="countChange(\''+subj+'\','+i+',this.value)">'
+'</div>'
+'</div>';
});
});
subjHtml+='</div>';
});
subjHtml='<div class="subjects-grid">'+subjHtml+'</div>';
var overallPct=Math.round(overallDone/overallTotal*100);
var html='<div class="wrap"><h1>Тренажер підготовки до НМТ</h1>'
+'<p class="intro">Онови позначки після кожного заняття.</p>'
+'<div class="rhythm">'
+'<div class="day" title="Математика"><span>Пн</span><div class="dots"><i class="dot" style="background:'+META.math.color+'"></i></div></div>'
+'<div class="day" title="Українська мова"><span>Вт</span><div class="dots"><i class="dot" style="background:'+META.ukr.color+'"></i></div></div>'
+'<div class="day" title="Математика"><span>Ср</span><div class="dots"><i class="dot" style="background:'+META.math.color+'"></i></div></div>'
+'<div class="day" title="Українська мова"><span>Чт</span><div class="dots"><i class="dot" style="background:'+META.ukr.color+'"></i></div></div>'
+'<div class="day" title="Математика, Історія України"><span>Пт</span><div class="dots"><i class="dot" style="background:'+META.math.color+'"></i><i class="dot" style="background:'+META.hist.color+'"></i></div></div>'
+'<div class="day" title="Українська мова, Англійська мова"><span>Сб</span><div class="dots"><i class="dot" style="background:'+META.ukr.color+'"></i><i class="dot" style="background:'+META.eng.color+'"></i></div></div>'
+'<div class="day" title="Повторення"><span>Нд</span><div class="dots"><i class="dot" style="background:'+'#9a9da3'+'"></i></div></div>'
+'</div>'
+'<ul class="legend">'
+'<li><span class="ic">📖</span> стаття з теорією (для англійської — граматика чи лексика з osvita.ua)</li>'
+'<li><span class="ic">▶️</span> відеоурок (пряме посилання або пошук на YouTube за назвою теми)</li>'
+'<li><span class="ic">🔢</span> тестування-пробник НМТ з osvita.ua</li>'
+'</ul>'
+'<div class="overall"><p class="meta">Загальний прогрес: '+overallDone+'/'+overallTotal+' ('+overallPct+'%)</p><div class="bar"><i style="width:'+overallPct+'%"></i></div></div>'
+syncBarHTML()
+subjHtml+'</div>';
document.getElementById('app').innerHTML=html;
}

function toggle(subj,i){
STATE[subj]=STATE[subj]||{};
var cur=STATE[subj][i]||{};
cur.done=!cur.done;
cur.date=cur.done?todayStr():'';
STATE[subj][i]=cur;
render();
persist();
}
function noteChange(subj,i,val){
STATE[subj]=STATE[subj]||{};
var cur=STATE[subj][i]||{};
cur.note=val;
STATE[subj][i]=cur;
persist();
}
function countChange(subj,i,val){
STATE[subj]=STATE[subj]||{};
var cur=STATE[subj][i]||{};
cur.count=val;
STATE[subj][i]=cur;
persist();
}

function addMock(ev,subj){
ev.preventDefault();
var inp=document.getElementById('mi-'+subj);
var val=parseFloat(inp.value);
if(isNaN(val)) return false;
STATE.mockLog=STATE.mockLog||{};
STATE.mockLog[subj]=STATE.mockLog[subj]||[];
STATE.mockLog[subj].push({date:todayStr(),score:val});
render();
persist();
return false;
}

function removeMock(subj,idx){
if(!STATE.mockLog||!STATE.mockLog[subj]) return;
STATE.mockLog[subj].splice(idx,1);
render();
persist();
}

function persist(){
try{
localStorage.setItem('nmt-tracker-state', JSON.stringify(STATE));
}catch(e){}
cloudSave();
}

function loadSaved(){
try{
var raw=localStorage.getItem('nmt-tracker-state');
return raw?JSON.parse(raw):null;
}catch(e){ return null; }
}

function init(state){
STATE=loadSaved()||state||{};
ORDER.forEach(function(s){ STATE[s]=STATE[s]||{}; });
STATE.mockLog=STATE.mockLog||{};
ORDER.forEach(function(s){ STATE.mockLog[s]=STATE.mockLog[s]||[]; });
var st=document.createElement('style');
st.textContent=styleText();
document.head.appendChild(st);
initFirebase();
render();
var code=getSyncCode();
if(db&&code){
cloudLoad(code,function(remote){
if(remote){
STATE=remote;
ORDER.forEach(function(s){ STATE[s]=STATE[s]||{}; });
STATE.mockLog=STATE.mockLog||{};
ORDER.forEach(function(s){ STATE.mockLog[s]=STATE.mockLog[s]||[]; });
render();
}
});
}
}
init({"math":{},"ukr":{},"hist":{},"eng":{},"mockLog":{"math":[],"ukr":[],"hist":[],"eng":[]}});
</script></body></html>
