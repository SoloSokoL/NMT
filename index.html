<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажер підготовки до НМТ</title>
<meta name="description" content="Тренажер підготовки до НМТ: теми, повторення, пробні тести, прогрес">
<meta name="theme-color" content="#3B5BDB">

<!-- Політика безпеки: скрипти лише з цього сайту й Firebase (gstatic), без інлайн-скриптів (події обробляє js/events.js);
     з'єднання лише з Firestore. Якщо щось перестало працювати — відкрий консоль браузера: порушення CSP видно там.
     Щоб тимчасово вимкнути політику, видали цей <meta>. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://firestore.googleapis.com https://*.googleapis.com https://*.workers.dev; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="НМТ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!-- Основний шрифт — Onest (повна кирилиця); якщо не завантажився — системний. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">

<link rel="stylesheet" href="css/style.css">

<!-- defer: сторінка показується одразу, скрипти виконуються після розбору HTML суворо за порядком.
     Порядок важливий: Firebase → дані → стан → події → ядро → функції → синхронізація → запуск. -->
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script defer src="js/topics.js"></script>
<script defer src="js/links.js"></script>
<script defer src="js/state.js"></script>
<script defer src="js/events.js"></script>
<script defer src="js/core.js"></script>
<script defer src="js/errors.js"></script>
<script defer src="js/stats.js"></script>
<script defer src="js/cards.js"></script>
<script defer src="js/sync.js"></script>
<script defer src="js/ai.js"></script>
<script defer src="js/app.js"></script>
</head>
<body>
<div id="app">Завантаження…</div>
<noscript>Для роботи тренажера потрібен JavaScript.</noscript>
</body>
</html>
