var db=null;
function initFirebase(){
if(FIREBASE_CONFIG.apiKey==="ВСТАВ_СЮДИ") return;
try{
if(window.firebase && !firebase.apps.length){ firebase.initializeApp(FIREBASE_CONFIG); }
db=firebase.firestore();
}catch(e){ db=null; }

function getSyncCode(){ try{ return localStorage.getItem('nmt-sync-code')||''; }catch(e){ return ''; } }
function setSyncCodeLS(code){ try{ localStorage.setItem('nmt-sync-code', code); }catch(e){} }
function cloudSave(){
if(!db) return;
var code=getSyncCode();
if(!code) return;
db.collection('nmt-tracker').doc(code).set(STATE).catch(function(){});
}
function cloudLoad(code,cb){
if(!db){ cb(null); return; }
db.collection('nmt-tracker').doc(code).get().then(function(snap){
cb(snap.exists?snap.data():null);
}).catch(function(){ cb(null); });
}
function applySyncCode(){
var inp=document.getElementById('syncCodeInput');
var code=(inp.value||'').trim();
var st=document.getElementById('syncStatusMsg');
if(!code) return;
setSyncCodeLS(code);
if(!db){ if(st) st.textContent='Хмара не налаштована у файлі (див. FIREBASE_CONFIG).'; return; }
if(st) st.textContent='Завантаження…';
cloudLoad(code,function(remote){
if(remote){
STATE=mergeState(STATE,remote); norm();
render();
persist();
if(st) st.textContent='Синхронізовано ✓';
} else {
cloudSave();
render();
if(st) st.textContent='Новий код створено, дані збережено ✓';
}
});
}
function genSyncCode(){
var inp=document.getElementById('syncCodeInput');
var c=Math.random().toString(36).slice(2,8).toUpperCase();
if(inp) inp.value=c;
applySyncCode();
}

function finalLinks(idx){
var fr=FINAL_ROWS[idx];
var seen={}, out=[];
fr.block.idx.forEach(function(i){
if(FINAL_ROWS[i]) return;
var tag=mathTestTag(TOPICS.math[i]);
if(tag&&!seen[tag]&&TAG_LABEL[tag]){ seen[tag]=1; out.push({label:TAG_LABEL[tag],url:MATH_TAG_BASE+tag}); }
});
return out;
}
// Returns {url, kind} where kind is 'theory' or 'test'; url may be null if no verified direct source exists.

if(subj==='math'){
var tag=mathTestTag(title);

}
if(subj==='ukr'){

}
return {url:null, kind:'test'};
}

function render(){
var overallDone=0, overallTotal=0, subjHtml='';
ORDER.forEach(function(subj){
var m=META[subj], list=TOPICS[subj], st=STATE[subj]||{};
var done=0;
list.forEach(function(_,i){ var e=st[TID[subj][i]]; if(e&&e.done) done++; });
overallDone+=done; overallTotal+=list.length;
var pct=Math.round(done/list.length*100);
subjHtml+='<div class="subject" style="--c:'+m.color+'">';
var SUBJ_ICON={math:'📐',ukr:'🔤',hist:'🏛️',eng:'🇬🇧'};
subjHtml+='<h2>'+SUBJ_ICON[subj]+' '+m.name+'</h2>';
subjHtml+='<p class="meta">'+done+'/'+list.length+' · ≈'+m.time+'</p>';
subjHtml+='<div class="bar"><i style="width:'+pct+'%"></i></div>';
var mocks=STATE.mockLog[subj]||[];
subjHtml+='<div class="mock"><h3>Пробні тести</h3><form onsubmit="return addMock(event,\''+subj+'\')"><input type="number" min="0" max="200" placeholder="бал" required id="mi-'+subj+'"><button type="submit">Додати</button></form>';

var seq=0;

if(subj==='math'&&FINAL_ROWS[i]){

function noteChange(subj,i,val){
STATE[subj]=STATE[subj]||{};
var cur=STATE[subj][TID[subj][i]]||{};
cur.note=val; cur.upd=Date.now();
STATE[subj][TID[subj][i]]=cur;
persist();
}
function countChange(subj,i,val){
STATE[subj]=STATE[subj]||{};
var cur=STATE[subj][TID[subj][i]]||{};
cur.count=val; cur.upd=Date.now();
STATE[subj][TID[subj][i]]=cur;
persist();
}

function addMock(ev,subj){
ev.preventDefault();
var inp=document.getElementById('mi-'+subj);
var val=parseFloat(inp.value);
if(isNaN(val)) return false;
STATE.mockLog=STATE.mockLog||{};
STATE.mockLog[subj]=STATE.mockLog[subj]||[];
STATE.mockLog[subj].push({date:todayStr(),score:val});
STATE.lupd=Date.now(); bump();
render();
persist();
return false;
}

function removeMock(subj,idx){
if(!STATE.mockLog||!STATE.mockLog[subj]) return;
STATE.mockLog[subj].splice(idx,1);
STATE.lupd=Date.now();
render();
persist();
}

function persist(){
try{
localStorage.setItem('nmt-tracker-state', JSON.stringify(STATE));
}catch(e){}
cloudSave();
}

function loadSaved(){
try{
var raw=localStorage.getItem('nmt-tracker-state');
return raw?JSON.parse(raw):null;
}catch(e){ return null; }
}

function init(state){
backupLegacy();
STATE=migrate(loadSaved()||state||{});
norm();
var st=document.createElement('style');
st.textContent=styleText();
document.head.appendChild(st);
initFirebase();
render();
var code=getSyncCode();
if(db&&code){
cloudLoad(code,function(remote){
if(remote){
STATE=mergeState(STATE,remote); norm();
render();
}
});
}
}
init({"math":{},"ukr":{},"hist":{},"eng":{},"mockLog":{"math":[],"ukr":[],"hist":[],"eng":[]}});
</script></body></html>
